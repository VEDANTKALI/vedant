version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aivoa_qms_postgres
    restart: always
    environment:
      POSTGRES_DB: aivoa_qms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivoa_qms_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/aivoa_qms
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_MODEL: gemma2-9b-it
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aivoa_qms_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
