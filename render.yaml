services:
  # 1. FastAPI Python Backend Service (100% Free Web Service)
  - type: web
    name: aivoa-qms-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: groq/compound

  # 2. React Vite Frontend Static Site (100% Free Static Site)
  - type: web
    name: aivoa-qms-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: aivoa-qms-backend
          property: url
